name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"
      - name: Publication safety
        run: python scripts/publication_check.py --history
      - name: Lint
        run: >-
          python -m ruff check scripts/publication_check.py &&
          python -m ruff check . --select E9,F63,F7,F82
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: RQ1 protocol bindings
        run: >-
          PYTHONPATH=src python -m gi_vqa.rq1_baseline check
          --project-root .
          --protocol protocols/study1/rq1_full_baseline_protocol_v1.draft.json
      - name: Build package
        run: python -m build
      - name: Generated-file check
        run: git diff --exit-code
